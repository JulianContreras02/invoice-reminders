# Integración continua: compila y prueba backend y frontend, y recorre la guía de verificación
# contra el docker compose real (MongoDB + Mailpit) en una máquina limpia de GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore InvoiceReminders.slnx

      - name: Compilar (advertencias como errores)
        run: dotnet build InvoiceReminders.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pruebas unitarias
        run: dotnet test InvoiceReminders.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Regla de dependencias (Application no conoce adaptadores)
        run: |
          if dotnet list src/InvoiceReminders.Application/InvoiceReminders.Application.csproj package --include-transitive \
            | grep -Ei 'mongodb|mailkit|mimekit|microsoft\.aspnetcore'; then
            echo "::error::Application depende de un paquete de infraestructura."
            exit 1
          fi

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (tsc estricto + vite build)
        run: npm run build

  compose-smoke:
    name: Despliegue con docker compose
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # Docker Hub y los registros de paquetes fallan a veces por problemas de red pasajeros
      # (resolución de nombres, cortes de conexión). Descargar y construir con reintentos evita
      # que un fallo de red marque como roto un despliegue que funciona.
      - name: Descargar imágenes y construir (con reintentos)
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::Falló tras 3 intentos: $*"
                return 1
              fi
              echo "::warning::Intento $attempt falló: $*. Reintento en $((attempt * 15)) s."
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }
          retry docker compose pull --ignore-buildable
          for image in node:22-alpine mcr.microsoft.com/dotnet/sdk:10.0 mcr.microsoft.com/dotnet/aspnet:10.0; do
            retry docker pull "$image"
          done
          retry docker compose build

      - name: Levantar app, MongoDB y Mailpit
        run: docker compose up -d --wait --wait-timeout 300

      - name: Verificación de la guía (7, 4 y 0 correos)
        run: bash .github/scripts/compose-smoke.sh

      # Además del log completo, deja las últimas líneas de cada contenedor como anotación del
      # trabajo, visible en el resumen de la ejecución sin necesidad de abrir el log.
      - name: Diagnóstico de los contenedores
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          for service in $(docker compose ps -a --services); do
            lines=$(docker compose logs --no-color --tail 8 "$service" 2>&1 | tail -c 1500 | tr -d '\r')
            lines=${lines//'%'/'%25'}
            lines=${lines//$'\n'/'%0A'}
            echo "::error title=Últimas líneas de ${service}::${lines}"
          done

      - name: Apagar
        if: always()
        run: docker compose down -v
