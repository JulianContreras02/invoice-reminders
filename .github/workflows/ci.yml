# Integración continua: compila y prueba backend y frontend, y ejecuta el guion del revisor
# contra el docker compose real (MongoDB + Mailpit) en una máquina limpia de GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore InvoiceReminders.slnx

      - name: Compilar (advertencias como errores)
        run: dotnet build InvoiceReminders.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pruebas unitarias
        run: dotnet test InvoiceReminders.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Regla de dependencias (Application no conoce adaptadores)
        run: |
          if dotnet list src/InvoiceReminders.Application/InvoiceReminders.Application.csproj package --include-transitive \
            | grep -Ei 'mongodb|mailkit|mimekit|microsoft\.aspnetcore'; then
            echo "::error::Application depende de un paquete de infraestructura."
            exit 1
          fi

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (tsc estricto + vite build)
        run: npm run build

  compose-smoke:
    name: Despliegue con docker compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Levantar app, MongoDB y Mailpit
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Guion del revisor (7, 4 y 0 correos)
        run: bash .github/scripts/compose-smoke.sh

      - name: Logs de la aplicación
        if: failure()
        run: docker compose logs app

      - name: Apagar
        if: always()
        run: docker compose down -v
